name: ci

# The app-side guardrail. Infrastructure is governed by schema validation;
# application code is governed by this. Agent-written code must format, compile
# with warnings as errors, pass tests, carry a migration for every model change,
# and build into an image whose migrations apply to a real Postgres - before a
# human looks at it.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    # Endpoint tests run against this. Each test clones its own database from a
    # migrated template (tests/App.Tests/Postgres), so they cannot see each
    # other's rows.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_POSTGRES: Host=localhost;Username=postgres;Password=ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration check diffs against the base branch

      # AGENT.md forbids faking the database in tests, and on 27 September an
      # agent run did it anyway with 94 green tests (FINDINGS.md #22). A rule
      # nobody checks gets broken, so this is a check, not a sentence (D-17).
      - name: no fake database in tests
        run: |
          if grep -rnE 'EntityFrameworkCore\.(InMemory|Sqlite)|Microsoft\.Data\.Sqlite|UseInMemoryDatabase|UseSqlite' \
               --include='*.cs' --include='*.csproj' --include='*.props' --include='*.targets' src tests Directory.*.props; then
            echo "::error::The EF in-memory provider and SQLite are forbidden here (AGENT.md, 'Every new route gets a test'). They hide exactly the differences that break against Postgres. Remove the package and its PackageVersion, and write an endpoint test against the real Postgres instead (EndpointTest, AGENT.md)."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - run: dotnet restore --locked-mode
      - run: dotnet tool restore

      - name: format
        run: dotnet format --verify-no-changes --no-restore

      - name: build
        run: dotnet build -c Release --no-restore

      # Tests that need no database. HealthTests forces PGHOST empty, so the
      # health contract is still proven without one.
      - name: test
        run: dotnet test -c Release --no-build --filter-not-trait "Category=Endpoint"

      # Routes against a real Postgres. A skipped endpoint test is a failure here
      # (a missing database must not pass), and so is a run that found none - a
      # broken filter or fixture would otherwise be a green build that tested
      # nothing (FINDINGS.md #24).
      - name: endpoint tests
        run: >-
          dotnet test -c Release --no-build
          --filter-trait "Category=Endpoint"
          --fail-skips on
          --minimum-expected-tests 1

      # Fails when the data model changed without `dotnet ef migrations add`.
      # Needs no database: it compares the model to the last migration's snapshot.
      - name: model has a migration
        run: dotnet ef migrations has-pending-model-changes --project src/App --no-build --configuration Release

      - name: migrations are immutable and expand-only
        if: github.event_name == 'pull_request'
        run: scripts/check-migrations.sh "origin/${{ github.base_ref }}"

  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only, no push. Proves the image is buildable before merge.
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The health contract: healthy with NO database configured.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          docker run -d --name app -p 8000:8000 app:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -sS http://localhost:8000/health
              docker rm -f app
              exit 0
            fi
            sleep 1
          done
          echo "Container never became healthy. Logs:"
          docker logs app
          docker rm -f app
          exit 1

      # The migration contract, exactly as the init container runs it. Twice:
      # the second run must be a no-op, which is what every replica after the
      # first will see.
      - name: Migrations apply to a real Postgres
        run: |
          set -euo pipefail
          pg=(--network host -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=ci -e PGDATABASE=postgres)
          docker run --rm "${pg[@]}" app:ci migrate
          docker run --rm "${pg[@]}" app:ci migrate | tee second.log
          grep -q "schema is current" second.log

      - name: App works against the migrated schema
        run: |
          set -euo pipefail
          docker run -d --name app --network host \
            -e PGHOST=localhost -e PGUSER=postgres -e PGPASSWORD=ci -e PGDATABASE=postgres app:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/health > /dev/null && break; sleep 1; done
          curl -fsS http://localhost:8000/ready
          curl -fsS -X POST http://localhost:8000/items -H 'content-type: application/json' -d '{"title":"ci"}'
          curl -fsS http://localhost:8000/items | grep -q '"title":"ci"'
          docker rm -f app
